name: Build and Push Production Image

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chisamuela/chisamuel-v2
  NEXT_PUBLIC_SERVER_URL: https://chisamuel.com

jobs:
  # ==========================================
  # JOB 1: Environment & Dependency Setup
  # ==========================================
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ==========================================
  # JOB 2: Code Quality & Type Checks (Sequential)
  # ==========================================
  check:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting
        run: pnpm run lint

      - name: Run TypeScript typechecking
        run: pnpm exec tsc --noEmit

  # ==========================================
  # JOB 3: Integration & Unit Tests (Sequential)
  # ==========================================
  test:
    runs-on: ubuntu-latest
    needs: check
    # Spin up MongoDB service to handle test-time database queries
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        env:
          # Use local MongoDB service container on port 27017 for integration tests
          DATABASE_URL: mongodb://localhost:27017/test-db
          # Use a self-contained placeholder secret for the test run
          PAYLOAD_SECRET: a_temporary_test_secret_key_to_pass_validation_12345
          NODE_ENV: test
        run: pnpm run test:int

  # ==========================================
  # JOB 4: Package & Push Docker Image (Sequential: Runs AFTER test is 100% complete)
  # ==========================================
  docker-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Seed Build Database
        env:
          DATABASE_URL: mongodb://localhost:27017/build-db
          DATABASE_URI: mongodb://localhost:27017/build-db
          PAYLOAD_SECRET: temporary-build-secret-chisamuel
          NEXT_PUBLIC_SERVER_URL: https://chisamuel.com
        run: pnpm run import-projects

      - name: Build Next.js App
        env:
          DATABASE_URL: mongodb://localhost:27017/build-db
          PAYLOAD_SECRET: temporary-build-secret-chisamuel
          NEXT_PUBLIC_SERVER_URL: https://chisamuel.com
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm run build

      - name: Copy @swc/helpers into standalone
        run: cp -r node_modules/@swc/helpers .next/standalone/node_modules/@swc/helpers

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v3
        with:
          images: ghcr.io/chisamuela/chisamuel-v2
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
